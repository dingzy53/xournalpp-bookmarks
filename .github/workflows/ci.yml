# Runs the tests on every push to main and every pull request,
# under Lua 5.4 (Ubuntu package) and Lua 5.5 (built from source).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests on Lua 5.4 (the export tests need pdftk)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 pdftk-java
          luac5.4 -p Bookmarks/*.lua tests/*.lua
          lua5.4 tests/run.lua

      - name: Build Lua 5.5.1
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz | tar xz
          make -C lua-5.5.1 linux
          echo "LUA55=$RUNNER_TEMP/lua-5.5.1/src" >> "$GITHUB_ENV"

      - name: Check syntax with Lua 5.5
        run: |
          "$LUA55/luac" -v
          "$LUA55/luac" -p Bookmarks/*.lua tests/*.lua

      - name: Run tests on Lua 5.5
        run: |
          "$LUA55/lua" -v
          "$LUA55/lua" tests/run.lua
